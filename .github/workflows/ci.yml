name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validation & Quality Gate
    runs-on: ubuntu-24.04
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Local Supabase
        run: supabase start

      - name: Extract Supabase Environment Variables
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d '=' -f 2 | tr -d '\"' | tr -d '\r')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep SERVICE_ROLE_KEY | cut -d '=' -f 2 | tr -d '\"' | tr -d '\r')" >> $GITHUB_ENV

      - name: Install NPM Dependencies
        run: npm ci

      - name: Check Linting Rules
        run: npm run lint

      - name: Check TypeScript Typings
        run: npx tsc --noEmit

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: Build Next.js Application
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        id: playwright
        run: npm run test:e2e

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v6
        if: failure() && steps.playwright.outcome == 'failure'
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
